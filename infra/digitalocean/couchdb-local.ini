; Production CouchDB policy. Authentication and per-database authorization are
; additionally enforced by _users roles, _security documents, and
; validate_doc_update functions installed by the platform setup scripts.

[couchdb]
single_node = true

[chttpd]
bind_address = 0.0.0.0
enable_cors = true
require_valid_user = true

[httpd]
WWW-Authenticate = Basic realm="TamamHealth clinical data"

[cors]
credentials = true
; Legacy direct-from-browser access. Browsers now replicate through the
; authenticated same-origin /api/couch gateway, so no browser origin needs to
; appear here; this list exists only for operator tooling during migration.
origins = https://staging.tamamhealth.org
methods = GET, PUT, POST, HEAD, DELETE
headers = accept, authorization, content-type, origin, referer, x-csrf-token
max_age = 600
