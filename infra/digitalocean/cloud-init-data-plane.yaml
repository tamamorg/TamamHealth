#cloud-config

package_update: true
package_upgrade: true
packages:
  - ca-certificates
  - curl
  - docker.io
  - docker-compose-v2
  - fail2ban
  - git
  - ufw
  - unattended-upgrades

write_files:
  - path: /etc/ssh/sshd_config.d/99-tamamhealth-hardening.conf
    owner: root:root
    permissions: "0644"
    content: |
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin prohibit-password
      X11Forwarding no
      AllowTcpForwarding no
      MaxAuthTries 3
  - path: /etc/fail2ban/jail.d/sshd.local
    owner: root:root
    permissions: "0644"
    content: |
      [sshd]
      enabled = true
      maxretry = 5
      findtime = 10m
      bantime = 1h

runcmd:
  - systemctl enable --now docker
  - systemctl enable --now fail2ban
  - systemctl enable --now unattended-upgrades
  - systemctl restart ssh
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow 22/tcp
  - ufw allow 80/tcp
  - ufw allow 443/tcp
  - ufw --force enable
  - mkdir -p /opt/tamamhealth
  - chmod 0750 /opt/tamamhealth

final_message: "TamamHealth data-plane bootstrap complete"
