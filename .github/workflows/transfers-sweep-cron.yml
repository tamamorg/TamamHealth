name: patient-transfers-sweep

# Hourly sweep of due internal patient transfers.
#
# `effectiveAt` and `expiresAt` on a patient transfer are promises made to
# clinicians: "this takes effect Monday", "this cover ends on the 14th". Nothing
# in an offline-first client can keep them — the browser that raised the transfer
# may be closed, offline, or belong to someone on leave. Without this caller a
# scheduled transfer never lands and a temporary grant never lapses, so the wrong
# clinician keeps both the patient and their chart access.
#
# Hourly, not daily: these are datetime-precision promises. A cover window that
# ends at 14:00 must not keep its access until the next morning, and an unmet
# expiry is a live access-control gap, not a cosmetic delay.
#
# Authentication uses GitHub's short-lived OIDC token, bound by the platform
# to this repository, this workflow on main, and schedule/workflow_dispatch.
# No long-lived production secret is required.
#
# The sweep is idempotent — it only acts on transfers whose clock has already
# run out, and each one flips status before the next run sees it. A missed run
# is therefore caught up by the next one rather than needing a manual replay.

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
    inputs:
      asOf:
        description: 'Optional ISO timestamp to sweep as of (for reconciling a missed run)'
        required: false
        type: string

permissions:
  contents: read
  id-token: write
  # Raise/close the failure alarm — see .github/actions/alert-failure.
  issues: write

concurrency:
  # Two overlapping sweeps could both read the same accepted transfer before
  # either writes. The service is guarded (completeTransfer rejects anything not
  # in `accepted`, and PouchDB would raise a revision conflict), so the worst
  # case is a wasted write and a logged failure — but serialising keeps the run
  # log readable and the failure count meaningful.
  group: patient-transfers-sweep
  cancel-in-progress: false

jobs:
  sweep:
    name: apply due transfers
    runs-on: ubuntu-latest
    # NOT `environment: production`.
    #
    # That gate exists so a human confirms a DEPLOYMENT. This is a scheduled
    # maintenance sweep, and a cron that needs an approval click every hour is
    # not a cron: once the environment gained required reviewers, every run sat
    # waiting, the next hour's run superseded it in the concurrency group, and
    # it was cancelled. No sweep ran at all between 2026-08-18 21:34 and the
    # removal of this line.
    #
    # The concurrency group above STAYS — it is what stops two sweeps racing
    # the same records, and it was not the cause.
    timeout-minutes: 10
    steps:
      # Only the alarm action — this job does not otherwise need the repo,
      # and a local `uses:` cannot resolve without a checkout. Sparse so it
      # stays a few kilobytes rather than a full clone.
      - name: Fetch the failure-alarm action
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github/actions/alert-failure
          sparse-checkout-cone-mode: false

      - name: Sweep
        env:
          BASE_URL: ${{ vars.PLATFORM_BASE_URL || 'https://app.tamamhealth.org' }}
          AS_OF: ${{ inputs.asOf }}
        run: |
          set -euo pipefail
          OIDC_RESPONSE="$(curl -sS --fail-with-body \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=tamamhealth-transfer-sweep")"
          OIDC_TOKEN="$(printf '%s' "$OIDC_RESPONSE" | jq -r '.value // empty')"
          if [ -z "$OIDC_TOKEN" ]; then
            echo "::error title=OIDC token missing::GitHub did not issue a transfer-sweep identity token."
            exit 1
          fi
          echo "::add-mask::$OIDC_TOKEN"

          # Diagnose a dead production ingress before presenting it as an
          # endpoint failure. Without this guard curl waits until exit 28 (host
          # down) or reports a bare "curl: (22) 502" (ingress up, no platform
          # container behind it — the 2026-09-08 outage), and the run reveals
          # neither the failed host nor the corrective action.
          HEALTH_STATUS="$(curl -sS -o /dev/null -w '%{http_code}' \
            --connect-timeout 10 --max-time 20 --retry 2 --retry-all-errors \
            "$BASE_URL/api/health" || echo 000)"
          if [ "$HEALTH_STATUS" = "000" ]; then
            echo "::error title=Production platform unreachable::$BASE_URL cannot be reached. Deploy/restore production or set the PLATFORM_BASE_URL repository variable to the canonical production origin. Do not point this clinical job at a demo deployment."
            exit 1
          fi
          if [ "$HEALTH_STATUS" = "502" ] || [ "$HEALTH_STATUS" = "504" ]; then
            echo "::error title=Production platform is down::$BASE_URL/api/health returned HTTP $HEALTH_STATUS — the ingress is up but no platform container answers behind it. Restore the stack on the host or re-run deploy-production; the sweep is idempotent and catches up on its next run."
            exit 1
          fi

          URL="$BASE_URL/api/patient-transfers/sweep"
          if [ -n "${AS_OF:-}" ]; then
            URL="$URL?asOf=$(printf '%s' "$AS_OF" | jq -sRr @uri)"
          fi

          # Capture the status and body separately: `--fail-with-body` inside a
          # `$( )` under `set -e` exits before the body is ever echoed, so a
          # failed sweep used to show only "curl: (22)" and nothing of what the
          # platform actually said. Any non-200 is a failed sweep.
          HTTP_STATUS="$(curl -sS -o "$RUNNER_TEMP/sweep-response.json" -w '%{http_code}' \
            --connect-timeout 10 --max-time 240 \
            -X POST \
            -H "authorization: Bearer $OIDC_TOKEN" \
            -H 'content-type: application/json' \
            "$URL" || echo 000)"
          RESPONSE="$(cat "$RUNNER_TEMP/sweep-response.json" 2>/dev/null || true)"
          echo "$RESPONSE"
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "::error title=Transfer sweep request failed::$URL answered HTTP $HTTP_STATUS (000 = no response). See the response body above; a 401/403 means the platform no longer trusts this workflow's OIDC token, a 5xx means the platform or its CouchDB is unhealthy."
            exit 1
          fi

          COMPLETED=$(echo "$RESPONSE" | jq -r '.completedCount // 0')
          EXPIRED=$(echo "$RESPONSE" | jq -r '.expiredCount // 0')
          FAILED=$(echo "$RESPONSE" | jq -r '.failedCount // 0')

          # Only write a run summary when something actually happened — an
          # hourly job that reports "0 0 0" 24 times a day trains operators to
          # ignore it, which is precisely when the one real failure gets missed.
          if [ "$COMPLETED" -gt 0 ] || [ "$EXPIRED" -gt 0 ] || [ "$FAILED" -gt 0 ]; then
            {
              echo "### Transfer sweep"
              echo ""
              echo "| Outcome | Count |"
              echo "| --- | --- |"
              echo "| Completed (took effect) | $COMPLETED |"
              echo "| Expired (access lapsed) | $EXPIRED |"
              echo "| Failed | $FAILED |"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          # A failed sweep entry means a transfer did NOT take effect, or a
          # lapsed grant still holds chart access. Both are clinical-safety
          # issues, so fail the run rather than leaving it in a log nobody reads.
          if [ "$FAILED" -gt 0 ]; then
            echo "$RESPONSE" | jq -r '.failed[] | "::error title=Transfer sweep failed::\(.id): \(.error)"'
            exit 1
          fi

      # An unread red run is not an alarm. Opens one issue while this
      # workflow is broken and closes it on the next success.
      - name: Raise or clear the failure alarm
        if: always()
        uses: ./.github/actions/alert-failure
        with:
          status: ${{ job.status }}
          severity: Scheduled patient transfers are not being applied on time. These are datetime-precision promises about a patient handover.
