name: docr-debug
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      - name: What does the registry actually contain
        run: |
          echo "=== v1 repository list ==="
          doctl registry repository list -o json || true
          echo "=== v2 repository list ==="
          doctl registry repository list-v2 -o json || true
          echo "=== docker catalog (the registry's own view) ==="
          doctl registry login --expiry-seconds 300
          AUTH=$(jq -r '.auths["registry.digitalocean.com"].auth' ~/.docker/config.json)
          TOKEN=$(curl -s -H "Authorization: Basic $AUTH" \
            --get --data-urlencode "scope=registry:catalog:*" --data-urlencode "service=registry.digitalocean.com" \
            "https://api.digitalocean.com/v2/registry/auth" | jq -r .token)
          curl -s -H "Authorization: Bearer $TOKEN" "https://registry.digitalocean.com/v2/_catalog" | head -c 600
          echo
          echo "=== subscription ==="
          curl -s -H "Authorization: Bearer ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}" \
            "https://api.digitalocean.com/v2/registry/subscription" | jq '.subscription.tier' || true
