name: recover-production-superadmin

# Required protected production-environment secrets:
#   PROD_SSH_HOST / PROD_SSH_USER / PROD_SSH_KEY / PROD_APP_DIR
#   SUPERADMIN_RECOVERY_PASSWORD (16+ chars; handed to the operator out of band)
# The recovery password travels to the host on SSH stdin and is never written
# to the repository, workflow inputs, command arguments, or the production env.

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type RESET to rotate the production superadmin back to its server bootstrap password.'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: recover-production-superadmin
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Require explicit confirmation
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: test "$CONFIRMATION" = RESET

      - uses: actions/checkout@v4

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PROD_SSH_KEY }}

      - name: Reset and verify production superadmin
        env:
          HOST: ${{ secrets.PROD_SSH_HOST }}
          USER: ${{ secrets.PROD_SSH_USER }}
          APP_DIR: ${{ secrets.PROD_APP_DIR || '/opt/tamamhealth' }}
          RECOVERY_PASSWORD: ${{ secrets.SUPERADMIN_RECOVERY_PASSWORD }}
        run: |
          if [ -z "$RECOVERY_PASSWORD" ]; then
            echo "::error title=Recovery credential missing::Set SUPERADMIN_RECOVERY_PASSWORD on the protected production environment."
            exit 1
          fi
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts
          scp scripts/recover-production-superadmin.sh "$USER@$HOST:/tmp/recover-production-superadmin.sh"
          # Send the protected secret on stdin, not in argv (where process
          # listings and SSH logs can expose it). The remote shell reads one
          # line, exports it only for the recovery process, then removes the
          # uploaded script regardless of success.
          printf '%s\n' "$RECOVERY_PASSWORD" | ssh "$USER@$HOST" \
            "IFS= read -r SUPERADMIN_RECOVERY_PASSWORD; if [ \"\${#SUPERADMIN_RECOVERY_PASSWORD}\" -lt 16 ]; then echo 'Recovery credential was not received' >&2; exit 1; fi; export SUPERADMIN_RECOVERY_PASSWORD; chmod 700 /tmp/recover-production-superadmin.sh && GH_OWNER=tamamorg IMAGE_TAG=production /tmp/recover-production-superadmin.sh '$APP_DIR'; status=\$?; rm -f /tmp/recover-production-superadmin.sh; exit \$status"
