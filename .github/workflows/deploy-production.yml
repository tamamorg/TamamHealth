name: deploy-production

# Manual-only. Pin the `production` GitHub environment to a required-reviewer
# list in the repo settings; GitHub will block the job until an approver
# clicks "Approve and deploy". While staging is paused, this workflow builds
# the exact selected main commit with production settings, publishes immutable
# SHA tags plus the production tags, and then deploys those images.

on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'Main-branch commit to deploy. Leave blank to use the current main HEAD.'
        required: false
        type: string
      target:
        description: 'Deploy target. "vps" = legacy SSH path; "aws" = CloudFormation deploy to af-south-1.'
        required: true
        type: choice
        default: vps
        options:
          - vps
          - aws

permissions:
  contents: read
  packages: write
  # Raise/close the failure alarm — see .github/actions/alert-failure.
  issues: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-production-images:
    name: build production images from selected main commit
    runs-on: ubuntu-latest
    environment: production
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      # `workflow_dispatch` lets the operator choose the ref, and with `sha`
      # left blank the promotion silently targets THAT ref's HEAD — so running
      # this from a topic branch would ship whatever happened to be on it. Every
      # other check here is about the image; this one is about the button.
      #
      # It is a floor, not the gate. The real gate is a required-reviewer list
      # on the `production` environment (see the note at the top of this file);
      # a branch check cannot ask a second person whether now is a good time.
      - name: Refuse to promote from anything but main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error title=Wrong branch::deploy-production was dispatched from '$GITHUB_REF'. Production promotes main only — re-run this workflow with the branch set to main."
            exit 1
          fi

      - name: Refuse an unconfigured deploy target before changing image tags
        env:
          TARGET: ${{ github.event.inputs.target || 'vps' }}
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          AWS_KEY: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SEC: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          ACM_ARN: ${{ secrets.PROD_ACM_CERT_ARN }}
          DOMAIN: ${{ secrets.PROD_DOMAIN }}
          KEYPAIR: ${{ secrets.PROD_EC2_KEYPAIR }}
          DB_PASSWORD: ${{ secrets.PROD_DB_MASTER_PASSWORD }}
        run: |
          missing=""
          if [ "$TARGET" = "vps" ]; then
            [ -n "$PROD_SSH_HOST" ] || missing="$missing PROD_SSH_HOST"
            [ -n "$PROD_SSH_USER" ] || missing="$missing PROD_SSH_USER"
            [ -n "$PROD_SSH_KEY" ] || missing="$missing PROD_SSH_KEY"
          else
            [ -n "$AWS_KEY" ] || missing="$missing AWS_ACCESS_KEY_ID"
            [ -n "$AWS_SEC" ] || missing="$missing AWS_SECRET_ACCESS_KEY"
            [ -n "$ACM_ARN" ] || missing="$missing PROD_ACM_CERT_ARN"
            [ -n "$DOMAIN" ] || missing="$missing PROD_DOMAIN"
            [ -n "$KEYPAIR" ] || missing="$missing PROD_EC2_KEYPAIR"
            [ -n "$DB_PASSWORD" ] || missing="$missing PROD_DB_MASTER_PASSWORD"
          fi
          if [ -n "$missing" ]; then
            echo "::error title=Production target not configured::Missing production-environment secrets:$missing"
            exit 1
          fi

      - name: Resolve target SHA
        id: resolve
        env:
          INPUT_SHA: ${{ github.event.inputs.sha }}
          HEAD_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REQUESTED="${INPUT_SHA:-$HEAD_SHA}"
          FULL_SHA="$(gh api "repos/$GITHUB_REPOSITORY/commits/$REQUESTED" --jq .sha)"
          SHORT="${FULL_SHA:0:7}"
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          {
            echo "sha=$SHORT"
            echo "full_sha=$FULL_SHA"
            echo "platform_image=ghcr.io/$OWNER/tamamhealth-platform"
            echo "website_image=ghcr.io/$OWNER/tamamhealth-website"
            echo "sync_worker_image=ghcr.io/$OWNER/tamamhealth-sync-worker"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.resolve.outputs.full_sha }}
          fetch-depth: 0

      - name: Require the selected commit to belong to main
        env:
          FULL_SHA: ${{ steps.resolve.outputs.full_sha }}
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$FULL_SHA" origin/main; then
            echo "::error title=Commit is not on main::$FULL_SHA is not an ancestor of origin/main. Merge and pass CI before deploying it."
            exit 1
          fi

      - name: Require successful CI for the selected commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FULL_SHA: ${{ steps.resolve.outputs.full_sha }}
        run: |
          CI_RUN="$(gh run list --workflow ci.yml --commit "$FULL_SHA" --limit 10 \
            --json databaseId,event,conclusion \
            --jq '[.[] | select(.event == "push" and .conclusion == "success")][0].databaseId // empty')"
          if [ -z "$CI_RUN" ]; then
            echo "::error title=CI evidence missing::No successful main-push CI run exists for $FULL_SHA. Wait for CI or repair it before deploying."
            exit 1
          fi
          echo "CI release evidence: run=$CI_RUN sha=$FULL_SHA"

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push production platform image
        uses: docker/build-push-action@v7
        with:
          context: ./platform
          file: ./platform/Dockerfile
          push: true
          tags: |
            ${{ steps.resolve.outputs.platform_image }}:${{ steps.resolve.outputs.sha }}
            ${{ steps.resolve.outputs.platform_image }}:production
          build-args: |
            NEXT_PUBLIC_DEMO_MODE=false
            NEXT_PUBLIC_SYNC_ENABLED=${{ vars.NEXT_PUBLIC_SYNC_ENABLED || 'true' }}
            NEXT_PUBLIC_COUCHDB_URL=${{ vars.NEXT_PUBLIC_COUCHDB_URL || 'https://app.tamamhealth.org/api/couch' }}
            NEXT_PUBLIC_COUCHDB_TENANT_DATABASES_ENABLED=${{ vars.NEXT_PUBLIC_COUCHDB_TENANT_DATABASES_ENABLED || 'true' }}
            NEXT_PUBLIC_COUCHDB_GATEWAY_ENABLED=${{ vars.NEXT_PUBLIC_COUCHDB_GATEWAY_ENABLED || 'true' }}
            NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL || 'https://app.tamamhealth.org' }}
            NEXT_PUBLIC_CLEAR_SEEDED_DATA_ONCE=${{ vars.NEXT_PUBLIC_CLEAR_SEEDED_DATA_ONCE || 'false' }}
            NEXT_PUBLIC_BUILD_ID=${{ steps.resolve.outputs.sha }}
          cache-from: type=gha,scope=platform
          cache-to: type=gha,mode=max,scope=platform

      - name: Build + push production website image
        uses: docker/build-push-action@v7
        with:
          context: ./website
          file: ./website/Dockerfile
          push: true
          tags: |
            ${{ steps.resolve.outputs.website_image }}:${{ steps.resolve.outputs.sha }}
            ${{ steps.resolve.outputs.website_image }}:production
          cache-from: type=gha,scope=website
          cache-to: type=gha,mode=max,scope=website

      - name: Build + push production sync-worker image
        uses: docker/build-push-action@v7
        with:
          context: ./sync-worker
          file: ./sync-worker/Dockerfile
          push: true
          tags: |
            ${{ steps.resolve.outputs.sync_worker_image }}:${{ steps.resolve.outputs.sha }}
            ${{ steps.resolve.outputs.sync_worker_image }}:production
          cache-from: type=gha,scope=sync-worker
          cache-to: type=gha,mode=max,scope=sync-worker

      # Without this a build failure is silent: the deploy jobs below only
      # `needs:` this one, so they report "skipped" rather than failed.
      - name: Raise or clear the failure alarm
        if: always()
        uses: ./.github/actions/alert-failure
        with:
          status: ${{ job.status }}
          severity: Production images could not be built, so no deploy can proceed.

  ssh-deploy:
    name: ssh deploy to production host (vps target)
    if: ${{ (github.event.inputs.target || 'vps') == 'vps' }}
    needs: build-production-images
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check whether SSH secrets are configured
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
        run: |
          missing=""
          [ -n "$PROD_SSH_HOST" ] || missing="$missing PROD_SSH_HOST"
          [ -n "$PROD_SSH_USER" ] || missing="$missing PROD_SSH_USER"
          [ -n "$PROD_SSH_KEY" ] || missing="$missing PROD_SSH_KEY"
          if [ -n "$missing" ]; then
            echo "::error title=Production deploy not configured::Image was tagged as production but no host can be deployed. Missing production-environment secrets:$missing"
            exit 1
          fi

      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.PROD_SSH_KEY }}

      - name: Pull + restart stack
        id: deploy
        env:
          HOST: ${{ secrets.PROD_SSH_HOST }}
          USER: ${{ secrets.PROD_SSH_USER }}
          APP_DIR: ${{ secrets.PROD_APP_DIR || '/opt/tamamhealth' }}
          SHA: ${{ needs.build-production-images.outputs.sha }}
          GH_OWNER: ${{ github.repository_owner }}
        run: |
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts
          ssh "$USER@$HOST" \
            "cd $APP_DIR && \
             previous_platform=\$(docker inspect \$(docker compose -f docker-compose.yml -f docker-compose.ghcr.yml ps -q platform) --format '{{.Image}}') && \
             test -n \"\$previous_platform\" && \
             printf '%s' \"\$previous_platform\" > '.tamamhealth-rollback-platform-$SHA' && \
             export GH_OWNER='$GH_OWNER' IMAGE_TAG='$SHA' && \
             docker compose -f docker-compose.yml -f docker-compose.ghcr.yml pull && \
             docker compose -f docker-compose.yml -f docker-compose.ghcr.yml up -d && \
             echo 'Deployed immutable tag=$SHA'"

      # The stack can come up and still be broken (bad env refuses boot with a
      # 500, a dead CouchDB degrades /api/health to 503). Fail the deploy run
      # loudly instead of leaving that for a clinician to discover.
      - name: Verify production health
        env:
          HEALTH_URL: ${{ secrets.PROD_HEALTH_URL || 'https://app.tamamhealth.org/api/health' }}
        run: |
          for i in $(seq 1 30); do
            STATUS="$(curl -sS -m 10 -o /tmp/health.json -w '%{http_code}' "$HEALTH_URL" || echo 000)"
            if [ "$STATUS" = "200" ]; then
              RELEASE="$(jq -r '.release // empty' /tmp/health.json)"
              if [ "$RELEASE" = "${{ needs.build-production-images.outputs.sha }}" ]; then
                echo "Healthy at expected release $RELEASE after ${i} checks:"; cat /tmp/health.json; echo
                exit 0
              fi
              echo "attempt ${i}: healthy response is stale release '${RELEASE:-unknown}', expected '${{ needs.build-production-images.outputs.sha }}'"
            else
              echo "attempt ${i}: $HEALTH_URL -> $STATUS"
            fi
            sleep 10
          done
          echo "::error title=Production unhealthy::$HEALTH_URL never returned 200 after the deploy. Last body:"
          cat /tmp/health.json 2>/dev/null || true
          exit 1

      # A failed health gate is already an outage; reporting it without
      # restoring the previously running image leaves the clinic down until a
      # human notices. The deploy step records only the prior immutable image
      # ID (never secrets). Recreate just the platform service from that exact
      # image, then prove the rollback itself is healthy.
      - name: Roll back unhealthy platform image
        if: ${{ failure() && steps.deploy.outcome == 'success' }}
        env:
          HOST: ${{ secrets.PROD_SSH_HOST }}
          USER: ${{ secrets.PROD_SSH_USER }}
          APP_DIR: ${{ secrets.PROD_APP_DIR || '/opt/tamamhealth' }}
          SHA: ${{ needs.build-production-images.outputs.sha }}
          GH_OWNER: ${{ github.repository_owner }}
          HEALTH_URL: ${{ secrets.PROD_HEALTH_URL || 'https://app.tamamhealth.org/api/health' }}
        run: |
          ssh "$USER@$HOST" \
            "set -eu; \
             cd '$APP_DIR'; \
             previous_platform=\$(cat '.tamamhealth-rollback-platform-$SHA'); \
             test -n \"\$previous_platform\"; \
             rollback_tag='tamamhealth-platform:rollback-$SHA'; \
             docker image tag \"\$previous_platform\" \"\$rollback_tag\"; \
             printf 'services:\n  platform:\n    image: %s\n' \"\$rollback_tag\" > '.tamamhealth-rollback-$SHA.yml'; \
             export GH_OWNER='$GH_OWNER' IMAGE_TAG='$SHA'; \
             docker compose -f docker-compose.yml -f docker-compose.ghcr.yml -f '.tamamhealth-rollback-$SHA.yml' up -d --no-deps --force-recreate platform; \
             docker image rm \"\$rollback_tag\" >/dev/null 2>&1 || true; \
             rm -f '.tamamhealth-rollback-$SHA.yml' '.tamamhealth-rollback-platform-$SHA'"
          for i in $(seq 1 18); do
            STATUS="$(curl -sS -m 10 -o /tmp/rollback-health.json -w '%{http_code}' "$HEALTH_URL" || echo 000)"
            if [ "$STATUS" = "200" ]; then
              echo "Rollback restored production after ${i} checks:"; cat /tmp/rollback-health.json; echo
              exit 0
            fi
            sleep 10
          done
          echo "::error title=Rollback failed::$HEALTH_URL did not recover after restoring the previous platform image."
          exit 1

      - name: Clean superseded images after a healthy deploy
        if: ${{ success() && steps.deploy.outcome == 'success' }}
        env:
          HOST: ${{ secrets.PROD_SSH_HOST }}
          USER: ${{ secrets.PROD_SSH_USER }}
          APP_DIR: ${{ secrets.PROD_APP_DIR || '/opt/tamamhealth' }}
          SHA: ${{ needs.build-production-images.outputs.sha }}
        run: |
          ssh "$USER@$HOST" \
            "cd '$APP_DIR' && \
             rm -f '.tamamhealth-rollback-platform-$SHA' && \
             docker image prune -f"

      # An unread red run is not an alarm. Opens one issue while this
      # workflow is broken and closes it on the next success.
      - name: Raise or clear the failure alarm
        if: always()
        uses: ./.github/actions/alert-failure
        with:
          status: ${{ job.status }}
          severity: Production is running whatever build it had before this run. New fixes are not live.

  aws-deploy:
    name: cloudformation deploy to af-south-1 (aws target)
    if: ${{ github.event.inputs.target == 'aws' }}
    needs: build-production-images
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7

      - name: Check AWS deploy prerequisites
        id: gate
        env:
          AWS_KEY: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SEC: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          ACM_ARN: ${{ secrets.PROD_ACM_CERT_ARN }}
          DOMAIN:  ${{ secrets.PROD_DOMAIN }}
          KEYPAIR: ${{ secrets.PROD_EC2_KEYPAIR }}
        run: |
          missing=""
          [ -n "$AWS_KEY" ] || missing="$missing AWS_ACCESS_KEY_ID"
          [ -n "$AWS_SEC" ] || missing="$missing AWS_SECRET_ACCESS_KEY"
          [ -n "$ACM_ARN" ] || missing="$missing PROD_ACM_CERT_ARN"
          [ -n "$DOMAIN" ]  || missing="$missing PROD_DOMAIN"
          [ -n "$KEYPAIR" ] || missing="$missing PROD_EC2_KEYPAIR"
          if [ -n "$missing" ]; then
            echo "::error title=AWS deploy not configured::Missing production-environment secrets:$missing"
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        if: steps.gate.outputs.ready == 'true'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'af-south-1' }}

      - name: Run cloudformation deploy
        if: steps.gate.outputs.ready == 'true'
        env:
          TAMAM_DB_PASSWORD: ${{ secrets.PROD_DB_MASTER_PASSWORD }}
          GH_OWNER: ${{ github.repository_owner }}
        run: |
          chmod +x ./infra/aws/scripts/deploy.sh
          ./infra/aws/scripts/deploy.sh \
              --env production \
              --domain "${{ secrets.PROD_DOMAIN }}" \
              --acm-cert "${{ secrets.PROD_ACM_CERT_ARN }}" \
              --instance-type "${{ vars.PROD_INSTANCE_TYPE || 't3.large' }}" \
              --image-tag production \
              --keypair "${{ secrets.PROD_EC2_KEYPAIR }}" \
              --region "${{ secrets.AWS_REGION || 'af-south-1' }}"

      # An unread red run is not an alarm. Opens one issue while this
      # workflow is broken and closes it on the next success.
      - name: Raise or clear the failure alarm
        if: always()
        uses: ./.github/actions/alert-failure
        with:
          status: ${{ job.status }}
          severity: Production is running whatever build it had before this run. New fixes are not live.
