name: deploy-production

# Manual-only. Pin the `production` GitHub environment to a required-reviewer
# list in the repo settings; GitHub will block the job until an approver
# clicks "Approve and deploy". The workflow re-tags the staging image to
# `production` so prod always ships a digest that has already been smoke-
# tested on staging — no fresh build right before a prod cutover.

on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'Short git SHA to promote (must already be tagged on the staging image). Leave blank to use the current main HEAD.'
        required: false
        type: string
      target:
        description: 'Deploy target. "vps" = legacy SSH path; "aws" = CloudFormation deploy to af-south-1.'
        required: true
        type: choice
        default: vps
        options:
          - vps
          - aws

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  promote-image:
    name: re-tag staging image as production
    runs-on: ubuntu-latest
    environment: production
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      # `workflow_dispatch` lets the operator choose the ref, and with `sha`
      # left blank the promotion silently targets THAT ref's HEAD — so running
      # this from a topic branch would ship whatever happened to be on it. Every
      # other check here is about the image; this one is about the button.
      #
      # It is a floor, not the gate. The real gate is a required-reviewer list
      # on the `production` environment (see the note at the top of this file);
      # a branch check cannot ask a second person whether now is a good time.
      - name: Refuse to promote from anything but main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error title=Wrong branch::deploy-production was dispatched from '$GITHUB_REF'. Production promotes main only — re-run this workflow with the branch set to main."
            exit 1
          fi

      - name: Resolve target SHA
        id: resolve
        env:
          INPUT_SHA: ${{ github.event.inputs.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ -n "$INPUT_SHA" ]; then
            SHORT="${INPUT_SHA:0:7}"
          else
            SHORT="${HEAD_SHA:0:7}"
          fi
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          {
            echo "sha=$SHORT"
            echo "platform_image=ghcr.io/$OWNER/tamamhealth-platform"
            echo "website_image=ghcr.io/$OWNER/tamamhealth-website"
            echo "sync_worker_image=ghcr.io/$OWNER/tamamhealth-sync-worker"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Production promotes an image that was BUILT by deploy-staging, and
      # NEXT_PUBLIC_DEMO_MODE is inlined into the client bundle at build time.
      # So production inherits whatever demo setting staging was built with,
      # and nothing downstream can override it. If the staging build was still
      # in demo mode (the droplets currently serve the public demo), promoting
      # it would seed fictional patients into a real facility's browsers.
      #
      # Refuse the promotion instead. To ship a real production image, unset
      # the NEXT_PUBLIC_DEMO_MODE repo/environment variable (or set it to
      # "false"), let deploy-staging rebuild, then re-run this workflow.
      - name: Refuse to promote a demo-mode image
        run: |
          SRC="${{ steps.resolve.outputs.platform_image }}:${{ steps.resolve.outputs.sha }}"
          # Recursive search rather than a fixed path: `imagetools inspect`
          # nests the config differently for single- vs multi-platform images.
          MODE="$(docker buildx imagetools inspect "$SRC" --format '{{ json . }}' \
                  | jq -r '.. | objects | .Labels? // empty | ."org.tamamhealth.demo-mode" // empty' \
                  | head -1)"
          echo "Image demo-mode label: '${MODE:-<absent>}'"
          if [ "$MODE" = "true" ]; then
            echo "::error title=Demo image blocked::$SRC was built with NEXT_PUBLIC_DEMO_MODE=true and would seed fictional patient data. Refusing to promote it to production."
            exit 1
          fi
          if [ -z "$MODE" ]; then
            echo "::error title=Unlabelled image::$SRC carries no org.tamamhealth.demo-mode label, so its demo setting cannot be verified. Rebuild it with the current platform/Dockerfile before promoting."
            exit 1
          fi

      - name: Re-tag platform ${{ steps.resolve.outputs.sha }} as production
        run: |
          SRC="${{ steps.resolve.outputs.platform_image }}:${{ steps.resolve.outputs.sha }}"
          DST="${{ steps.resolve.outputs.platform_image }}:production"
          docker buildx imagetools create -t "$DST" "$SRC"

      - name: Re-tag website ${{ steps.resolve.outputs.sha }} as production
        run: |
          SRC="${{ steps.resolve.outputs.website_image }}:${{ steps.resolve.outputs.sha }}"
          DST="${{ steps.resolve.outputs.website_image }}:production"
          docker buildx imagetools create -t "$DST" "$SRC"

      - name: Re-tag sync-worker ${{ steps.resolve.outputs.sha }} as production
        run: |
          SRC="${{ steps.resolve.outputs.sync_worker_image }}:${{ steps.resolve.outputs.sha }}"
          DST="${{ steps.resolve.outputs.sync_worker_image }}:production"
          docker buildx imagetools create -t "$DST" "$SRC"

  ssh-deploy:
    name: ssh deploy to production host (vps target)
    if: ${{ (github.event.inputs.target || 'vps') == 'vps' }}
    needs: promote-image
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check whether SSH secrets are configured
        id: gate
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
        run: |
          if [ -n "$PROD_SSH_HOST" ] && [ -n "$PROD_SSH_USER" ] && [ -n "$PROD_SSH_KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Production SSH not configured::Image was re-tagged as :production but no host was deployed. Set PROD_SSH_HOST/USER/KEY in the production environment to enable."
          fi

      - name: Set up SSH agent
        if: steps.gate.outputs.ready == 'true'
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PROD_SSH_KEY }}

      - name: Pull + restart stack
        if: steps.gate.outputs.ready == 'true'
        env:
          HOST: ${{ secrets.PROD_SSH_HOST }}
          USER: ${{ secrets.PROD_SSH_USER }}
          APP_DIR: ${{ secrets.PROD_APP_DIR || '/opt/tamamhealth' }}
          SHA: ${{ needs.promote-image.outputs.sha }}
          GH_OWNER: ${{ github.repository_owner }}
        run: |
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts
          ssh "$USER@$HOST" \
            "cd $APP_DIR && \
             export GH_OWNER='$GH_OWNER' IMAGE_TAG=production && \
             docker compose -f docker-compose.yml -f docker-compose.ghcr.yml pull && \
             docker compose -f docker-compose.yml -f docker-compose.ghcr.yml up -d && \
             docker image prune -f && \
             echo 'Deployed sha=$SHA tag=production'"

  aws-deploy:
    name: cloudformation deploy to af-south-1 (aws target)
    if: ${{ github.event.inputs.target == 'aws' }}
    needs: promote-image
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7

      - name: Check AWS deploy prerequisites
        id: gate
        env:
          AWS_KEY: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SEC: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          ACM_ARN: ${{ secrets.PROD_ACM_CERT_ARN }}
          DOMAIN:  ${{ secrets.PROD_DOMAIN }}
          KEYPAIR: ${{ secrets.PROD_EC2_KEYPAIR }}
        run: |
          missing=""
          [ -n "$AWS_KEY" ] || missing="$missing AWS_ACCESS_KEY_ID"
          [ -n "$AWS_SEC" ] || missing="$missing AWS_SECRET_ACCESS_KEY"
          [ -n "$ACM_ARN" ] || missing="$missing PROD_ACM_CERT_ARN"
          [ -n "$DOMAIN" ]  || missing="$missing PROD_DOMAIN"
          [ -n "$KEYPAIR" ] || missing="$missing PROD_EC2_KEYPAIR"
          if [ -n "$missing" ]; then
            echo "::error title=AWS deploy not configured::Missing production-environment secrets:$missing"
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        if: steps.gate.outputs.ready == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'af-south-1' }}

      - name: Run cloudformation deploy
        if: steps.gate.outputs.ready == 'true'
        env:
          TAMAM_DB_PASSWORD: ${{ secrets.PROD_DB_MASTER_PASSWORD }}
          GH_OWNER: ${{ github.repository_owner }}
        run: |
          chmod +x ./infra/aws/scripts/deploy.sh
          ./infra/aws/scripts/deploy.sh \
              --env production \
              --domain "${{ secrets.PROD_DOMAIN }}" \
              --acm-cert "${{ secrets.PROD_ACM_CERT_ARN }}" \
              --instance-type "${{ vars.PROD_INSTANCE_TYPE || 't3.large' }}" \
              --image-tag production \
              --keypair "${{ secrets.PROD_EC2_KEYPAIR }}" \
              --region "${{ secrets.AWS_REGION || 'af-south-1' }}"
