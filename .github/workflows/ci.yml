name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Pull requests only need CI for their latest commit, but every push to main must
# finish so branch protection and deployment gates receive a conclusive result.
# A unique run-id fallback also prevents GitHub from replacing an older pending
# main run when another push enters the concurrency group.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  platform:
    name: platform · lint + type-check + test + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: platform/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        # `next lint` reports warnings but only exits non-zero on errors. This
        # is intentional for now — there is a backlog of react-hooks/exhaustive-deps
        # warnings we don't want CI to gate on. Tighten to --max-warnings=0
        # once those are cleaned up.
        run: npm run lint

      - name: Translation coverage
        run: npm run i18n:check

      - name: High-severity dependency gate
        run: npm audit --omit=dev --audit-level=high

      - name: Type-check
        run: npx tsc --noEmit

      - name: Test
        run: npm run test:ci

      - name: Build
        # Builds the Next.js production bundle. Catches problems that only
        # surface at build time (server/client boundary issues, env-bundling
        # regressions like the seed-credentials change).
        run: npm run build
        env:
          # Build needs a JWT_SECRET to satisfy the production guard in
          # instrumentation.ts. CI is not deploying anything, so a throwaway
          # value is fine — production deploys inject the real one.
          JWT_SECRET: ci-build-non-secret-do-not-use-anywhere-real
          # Build the configuration we actually SHIP. Demo mode is opt-out
          # (`!== 'false'`), so leaving this unset meant CI only ever compiled
          # the demo variant and never exercised the real-mode code paths that
          # reach production.
          NEXT_PUBLIC_DEMO_MODE: 'false'
          NEXT_PUBLIC_SYNC_ENABLED: 'true'
          NEXT_PUBLIC_COUCHDB_TENANT_DATABASES_ENABLED: 'true'
          NEXT_PUBLIC_COUCHDB_GATEWAY_ENABLED: 'true'
          NEXT_PUBLIC_COUCHDB_URL: https://staging.example.invalid/api/couch
          NEXT_PUBLIC_APP_URL: https://staging.example.invalid
          COUCHDB_URL: http://10.114.0.3:5984
          COUCHDB_ADMIN_USER: ci-admin
          COUCHDB_ADMIN_PASSWORD: ci-admin-password-0123456789-abcdefghijklmnopqrstuvwxyz
          COUCHDB_GATEWAY_SECRET: ci-gateway-secret-0123456789-abcdefghijklmnopqrstuvwxyz
          COUCHDB_WEBHOOK_SECRET: ci-webhook-secret-0123456789-abcdefghijklmnopqrstuvwxyz
          PHI_ENCRYPTION_ENABLED: 'true'
          PHI_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          UPSTASH_REDIS_REST_URL: https://redis.example.invalid
          UPSTASH_REDIS_REST_TOKEN: ci-token
          AIRTEL_WEBHOOK_SECRET: ci-airtel-secret-0123456789-abcdefghijklmnopqrstuvwxyz
          AIRTEL_WEBHOOK_GATEWAY_VERIFIED: 'true'
          MPESA_WEBHOOK_SECRET: ci-mpesa-secret-0123456789-abcdefghijklmnopqrstuvwxyz
          MPESA_WEBHOOK_GATEWAY_VERIFIED: 'true'
          NEXT_TELEMETRY_DISABLED: '1'

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: platform-coverage
          path: platform/coverage
          if-no-files-found: ignore
          retention-days: 14

  website:
    name: website · lint + type-check + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: High-severity dependency gate
        run: npm audit --omit=dev --audit-level=high

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

  sync-worker:
    name: sync-worker · syntax check + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sync-worker
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # Pure-Node service with no dependencies — no `npm ci` needed. The tests
      # also read platform/src/modules/analytics/api/sync-route.ts, so the
      # whole repo is checked out (the default).
      - name: Syntax check
        run: npm run check

      - name: Tests
        run: npm test

  # Not a required check: the integration suite is skipped locally unless
  # COUCH_IT_URL is set, and this job gives it a throwaway CouchDB to run
  # against. It creates its own uniquely named databases and users.
  couch-gateway-live:
    name: couch-gateway · live CouchDB integration
    runs-on: ubuntu-latest
    services:
      couchdb:
        image: couchdb:3
        env:
          COUCHDB_USER: ci-admin
          COUCHDB_PASSWORD: ci-throwaway-password-not-a-secret
        ports:
          - 5984:5984
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: platform/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Wait for CouchDB
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5984/_up >/dev/null; then exit 0; fi
            sleep 2
          done
          echo "::error title=CouchDB did not start::The couchdb:3 service never answered /_up."
          exit 1

      - name: Gateway tests against live CouchDB
        env:
          COUCH_IT_URL: http://127.0.0.1:5984
          COUCH_IT_USER: ci-admin
          COUCH_IT_PASSWORD: ci-throwaway-password-not-a-secret
        run: npx jest --ci src/__tests__/integration/couch-gateway-live.test.ts

  fingerprint-bridge:
    name: fingerprint-bridge · syntax check + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/tools/fingerprint-bridge
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # Pure-Node service with no dependencies — no `npm ci` needed.
      - name: Syntax check
        run: npm run check

      - name: Tests
        run: npm test

  infrastructure:
    name: infrastructure · migration scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: platform/package-lock.json

      # The migration scripts import the application's TypeScript sync-config
      # and permission matrix through tsx, so they need the platform's
      # dependencies installed rather than bare Node.
      - name: Install platform dependencies
        working-directory: platform
        run: npm ci

      - name: Validate migration scripts without network writes
        working-directory: platform
        env:
          DRY_RUN: 'true'
          COUCHDB_URL: https://couch.invalid
          COUCHDB_ADMIN_USER: ci-user
          COUCHDB_ADMIN_PASSWORD: ci-password
          COUCHDB_TENANT_ORG_IDS: org-ci-clinic
        run: npm run db:migrate:couchdb-tenants
