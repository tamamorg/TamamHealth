name: telehealth-maintenance

# Hourly telehealth reconciliation + stale-session sweep (KAN-127/128/143/144).
#
# expireStaleSessions/reconcileTelehealth existed and were tested, but nothing
# ever called them — a session left in waiting_room or in_session stayed there
# forever, todayActive counted ghosts, and appointment/session divergences were
# never surfaced. This is the missing caller.
#
# Hourly is deliberate: the no-show grace period is 2h and the abandoned-wait
# threshold 90min, so an hourly sweep bounds how stale those states can get
# without hammering the API.
#
# Required secrets (production environment):
#   PLATFORM_BASE_URL                e.g. https://app.tamamhealth.org
#   TELEHEALTH_MAINTENANCE_SECRET    must match the platform's env var of the same name

on:
  schedule:
    - cron: '15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Never let two sweeps overlap. The sweep is idempotent (only OPEN_STATUSES
  # are touched and a closed session is left alone), but serialising runs keeps
  # the findings log readable.
  group: telehealth-maintenance
  cancel-in-progress: false

jobs:
  sweep:
    name: reconcile telehealth sessions
    runs-on: ubuntu-latest
    # NOT `environment: production`.
    #
    # That gate exists so a human confirms a DEPLOYMENT. This is a scheduled
    # maintenance sweep, and a cron that needs an approval click every hour is
    # not a cron: once the environment gained required reviewers, every run sat
    # waiting, the next hour's run superseded it in the concurrency group, and
    # it was cancelled. No sweep ran at all between 2026-08-18 21:34 and the
    # removal of this line.
    #
    # The concurrency group above STAYS — it is what stops two sweeps racing
    # the same records, and it was not the cause.
    timeout-minutes: 10
    steps:
      - name: Check configuration
        id: gate
        env:
          BASE_URL: ${{ secrets.PLATFORM_BASE_URL }}
          MAINTENANCE_SECRET: ${{ secrets.TELEHEALTH_MAINTENANCE_SECRET }}
        run: |
          if [ -n "$BASE_URL" ] && [ -n "$MAINTENANCE_SECRET" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::error title=Telehealth maintenance not configured::PLATFORM_BASE_URL and TELEHEALTH_MAINTENANCE_SECRET are unset, so telehealth maintenance did nothing — stale rooms and expired links are NOT cleaned up. Set them as repository secrets. This step FAILS rather than passing quietly: it reported success for weeks while doing nothing, and a green tick on a job that no-ops is how that went unnoticed."
            exit 1
          fi

      - name: Sweep
        if: steps.gate.outputs.ready == 'true'
        env:
          BASE_URL: ${{ secrets.PLATFORM_BASE_URL }}
          MAINTENANCE_SECRET: ${{ secrets.TELEHEALTH_MAINTENANCE_SECRET }}
        run: |
          set -euo pipefail
          RESPONSE=$(curl -sS --fail-with-body \
            --max-time 300 \
            -X POST \
            -H "x-telehealth-maintenance-secret: $MAINTENANCE_SECRET" \
            -H 'content-type: application/json' \
            "$BASE_URL/api/telehealth/maintenance")
          echo "$RESPONSE"

          # Surface the counts in the run summary so an operator can see sweep
          # health without opening the app. The response carries ids and counts
          # only — never patient data.
          echo "### Telehealth maintenance" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          echo "$RESPONSE" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
