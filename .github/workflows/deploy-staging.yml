name: deploy-staging

# Runs on every push to main. CI must pass first (workflow_run trigger), then
# we build platform + website Docker images, publish them to GHCR, and — if
# the SSH secrets are configured — pull + restart the stack on the staging
# host. The image build/publish half always runs; the SSH deploy half is
# opt-in so the pipeline stays green before the staging server is wired up.

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  build-and-push:
    name: build + push images to GHCR
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Resolve image metadata
        id: meta
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          SHA="${{ github.event.workflow_run.head_sha }}"
          SHORT_SHA="${SHA:0:7}"
          {
            echo "owner=$OWNER"
            echo "sha=$SHORT_SHA"
            echo "platform_image=ghcr.io/$OWNER/tamamhealth-platform"
            echo "website_image=ghcr.io/$OWNER/tamamhealth-website"
            echo "sync_worker_image=ghcr.io/$OWNER/tamamhealth-sync-worker"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push platform image
        uses: docker/build-push-action@v6
        with:
          context: ./platform
          file: ./platform/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.platform_image }}:${{ steps.meta.outputs.sha }}
            ${{ steps.meta.outputs.platform_image }}:staging
          # NEXT_PUBLIC_* is inlined into the client bundle at BUILD time, so
          # demo mode has to be decided here — no runtime env can undo it. This
          # image is also what deploy-production promotes, so whatever is baked
          # in here is what production ships.
          #
          # Defaults to "false" (real mode). Set the repository/environment
          # variable NEXT_PUBLIC_DEMO_MODE to "true" only while these droplets
          # are still serving the public demo described in
          # docs/DEMO-LAUNCH-tamamhealth-org.md.
          #
          # The same is true of every other NEXT_PUBLIC_* the Dockerfile
          # declares: it passes each one explicitly on the `npm run build` line,
          # so an arg omitted HERE overrides platform/.env.production rather
          # than deferring to it. Omitting the two sync flags shipped images
          # whose client bundle had `isSyncEnabled()` permanently false — every
          # record stayed in the browser tab that typed it and never reached
          # CouchDB, while the runtime env said sync was on.
          build-args: |
            NEXT_PUBLIC_DEMO_MODE=${{ vars.NEXT_PUBLIC_DEMO_MODE || 'false' }}
            NEXT_PUBLIC_SYNC_ENABLED=${{ vars.NEXT_PUBLIC_SYNC_ENABLED || 'true' }}
            NEXT_PUBLIC_COUCHDB_URL=${{ vars.NEXT_PUBLIC_COUCHDB_URL || 'https://couch.tamamhealth.org' }}
            NEXT_PUBLIC_COUCHDB_TENANT_DATABASES_ENABLED=${{ vars.NEXT_PUBLIC_COUCHDB_TENANT_DATABASES_ENABLED || 'false' }}
            NEXT_PUBLIC_COUCHDB_GATEWAY_ENABLED=${{ vars.NEXT_PUBLIC_COUCHDB_GATEWAY_ENABLED || 'false' }}
            NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL || 'https://app.tamamhealth.org' }}
            NEXT_PUBLIC_CLEAR_SEEDED_DATA_ONCE=${{ vars.NEXT_PUBLIC_CLEAR_SEEDED_DATA_ONCE || 'false' }}
            NEXT_PUBLIC_BUILD_ID=${{ steps.meta.outputs.sha }}
            # Telehealth's LiveKit origin. The key and secret are runtime-only,
            # but this one is needed HERE: the CSP is built in middleware, where
            # Next inlines env at build time, so an image built without it ships
            # a policy with no LiveKit origin and the browser blocks the call's
            # signalling socket — a call that never connects, with only a console
            # violation to say why.
            #
            # Deliberately has NO fallback. An invented URL would widen the CSP
            # to a host that is not the deployment's LiveKit server. Left unset,
            # telehealth degrades cleanly: /api/telehealth/token answers 503 and
            # the UI says video is not configured. Set the repository variable
            # NEXT_PUBLIC_LIVEKIT_URL (same value as the runtime LIVEKIT_URL) to
            # turn it on — and note that setting the three runtime LiveKit vars
            # WITHOUT this one makes config-validation refuse to boot.
            NEXT_PUBLIC_LIVEKIT_URL=${{ vars.NEXT_PUBLIC_LIVEKIT_URL }}
          cache-from: type=gha,scope=platform
          cache-to: type=gha,mode=max,scope=platform

      - name: Build + push website image
        uses: docker/build-push-action@v6
        with:
          context: ./website
          file: ./website/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.website_image }}:${{ steps.meta.outputs.sha }}
            ${{ steps.meta.outputs.website_image }}:staging
          cache-from: type=gha,scope=website
          cache-to: type=gha,mode=max,scope=website

      - name: Build + push sync-worker image
        uses: docker/build-push-action@v6
        with:
          context: ./sync-worker
          file: ./sync-worker/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.sync_worker_image }}:${{ steps.meta.outputs.sha }}
            ${{ steps.meta.outputs.sync_worker_image }}:staging
          cache-from: type=gha,scope=sync-worker
          cache-to: type=gha,mode=max,scope=sync-worker

  ssh-deploy:
    name: ssh deploy to staging host
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Check whether SSH secrets are configured
        id: gate
        env:
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
        run: |
          if [ -n "$STAGING_SSH_HOST" ] && [ -n "$STAGING_SSH_USER" ] && [ -n "$STAGING_SSH_KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Staging SSH not configured::Skipping deploy. Set STAGING_SSH_HOST/USER/KEY in the staging environment to enable."
          fi

      - name: Set up SSH agent
        if: steps.gate.outputs.ready == 'true'
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.STAGING_SSH_KEY }}

      - name: Pull + restart stack
        if: steps.gate.outputs.ready == 'true'
        env:
          HOST: ${{ secrets.STAGING_SSH_HOST }}
          USER: ${{ secrets.STAGING_SSH_USER }}
          APP_DIR: ${{ secrets.STAGING_APP_DIR || '/opt/tamamhealth' }}
          SHA: ${{ needs.build-and-push.outputs.sha }}
          GH_OWNER: ${{ github.repository_owner }}
        run: |
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts
          ssh "$USER@$HOST" \
            "cd $APP_DIR && \
             export GH_OWNER='$GH_OWNER' IMAGE_TAG=staging && \
             docker compose -f docker-compose.yml -f docker-compose.ghcr.yml pull && \
             docker compose -f docker-compose.yml -f docker-compose.ghcr.yml up -d && \
             docker image prune -f && \
             echo 'Deployed sha=$SHA tag=staging'"
