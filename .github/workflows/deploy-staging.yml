name: deploy-staging

# Temporarily manual-only while the project operates a single production VPS.
# Re-enable the workflow_run trigger only after a real staging host, TLS, and
# the staging environment secrets have been provisioned. A manual run still
# fails closed when that infrastructure is absent.

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  # Raise/close the failure alarm — see .github/actions/alert-failure.
  issues: write

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  build-and-push:
    name: build + push images to GHCR
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Resolve image metadata
        id: meta
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          SHA="$(git rev-parse HEAD)"
          SHORT_SHA="${SHA:0:7}"
          {
            echo "owner=$OWNER"
            echo "sha=$SHORT_SHA"
            echo "platform_image=ghcr.io/$OWNER/tamamhealth-platform"
            echo "website_image=ghcr.io/$OWNER/tamamhealth-website"
            echo "sync_worker_image=ghcr.io/$OWNER/tamamhealth-sync-worker"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push platform image
        uses: docker/build-push-action@v7
        with:
          context: ./platform
          file: ./platform/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.platform_image }}:${{ steps.meta.outputs.sha }}
            ${{ steps.meta.outputs.platform_image }}:staging
          # NEXT_PUBLIC_* is inlined into the client bundle at BUILD time, so
          # demo mode has to be decided here — no runtime env can undo it. This
          # image is also what deploy-production promotes, so whatever is baked
          # in here is what production ships.
          #
          # Defaults to "false" (real mode). Set the repository/environment
          # variable NEXT_PUBLIC_DEMO_MODE to "true" only while these droplets
          # are still serving the public demo described in
          # docs/DEMO-LAUNCH-tamamhealth-org.md.
          #
          # The same is true of every other NEXT_PUBLIC_* the Dockerfile
          # declares: it passes each one explicitly on the `npm run build` line,
          # so an arg omitted HERE overrides platform/.env.production rather
          # than deferring to it. Omitting the two sync flags shipped images
          # whose client bundle had `isSyncEnabled()` permanently false — every
          # record stayed in the browser tab that typed it and never reached
          # CouchDB, while the runtime env said sync was on.
          # The sync trio defaults to the PRODUCTION-correct values (gateway on,
          # tenant databases on, same-origin /api/couch URL) because these repo
          # variables were unset for weeks and the 'false' defaults shipped a
          # production bundle that pushed straight at couch.tamamhealth.org,
          # collected 401s, and never synced a single record. The client also
          # derives the gateway URL from the page origin at runtime, so the URL
          # baked here only feeds the sync-enabled check and non-gateway builds.
          build-args: |
            NEXT_PUBLIC_DEMO_MODE=${{ vars.NEXT_PUBLIC_DEMO_MODE || 'false' }}
            NEXT_PUBLIC_SYNC_ENABLED=${{ vars.NEXT_PUBLIC_SYNC_ENABLED || 'true' }}
            NEXT_PUBLIC_COUCHDB_URL=${{ vars.NEXT_PUBLIC_COUCHDB_URL || 'https://app.tamamhealth.org/api/couch' }}
            NEXT_PUBLIC_COUCHDB_TENANT_DATABASES_ENABLED=${{ vars.NEXT_PUBLIC_COUCHDB_TENANT_DATABASES_ENABLED || 'true' }}
            NEXT_PUBLIC_COUCHDB_GATEWAY_ENABLED=${{ vars.NEXT_PUBLIC_COUCHDB_GATEWAY_ENABLED || 'true' }}
            NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL || 'https://app.tamamhealth.org' }}
            NEXT_PUBLIC_CLEAR_SEEDED_DATA_ONCE=${{ vars.NEXT_PUBLIC_CLEAR_SEEDED_DATA_ONCE || 'false' }}
            NEXT_PUBLIC_BUILD_ID=${{ steps.meta.outputs.sha }}
          cache-from: type=gha,scope=platform
          cache-to: type=gha,mode=max,scope=platform

      - name: Build + push website image
        uses: docker/build-push-action@v7
        with:
          context: ./website
          file: ./website/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.website_image }}:${{ steps.meta.outputs.sha }}
            ${{ steps.meta.outputs.website_image }}:staging
          cache-from: type=gha,scope=website
          cache-to: type=gha,mode=max,scope=website

      - name: Build + push sync-worker image
        uses: docker/build-push-action@v7
        with:
          context: ./sync-worker
          file: ./sync-worker/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.sync_worker_image }}:${{ steps.meta.outputs.sha }}
            ${{ steps.meta.outputs.sync_worker_image }}:staging
          cache-from: type=gha,scope=sync-worker
          cache-to: type=gha,mode=max,scope=sync-worker

      # An unread red run is not an alarm. Opens one issue while this
      # workflow is broken and closes it on the next success.
      - name: Raise or clear the failure alarm
        if: always()
        uses: ./.github/actions/alert-failure
        with:
          status: ${{ job.status }}
          severity: Staging is not up to date, so nothing is being validated before production.

  ssh-deploy:
    name: ssh deploy to staging host
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: staging
    steps:
      # Only the alarm action — this job does not otherwise need the repo,
      # and a local `uses:` cannot resolve without a checkout. Sparse so it
      # stays a few kilobytes rather than a full clone.
      - name: Fetch the failure-alarm action
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/actions/alert-failure
          sparse-checkout-cone-mode: false

      - name: Check whether SSH secrets are configured
        env:
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
        run: |
          missing=""
          [ -n "$STAGING_SSH_HOST" ] || missing="$missing STAGING_SSH_HOST"
          [ -n "$STAGING_SSH_USER" ] || missing="$missing STAGING_SSH_USER"
          [ -n "$STAGING_SSH_KEY" ] || missing="$missing STAGING_SSH_KEY"
          if [ -n "$missing" ]; then
            echo "::error title=Staging deploy not configured::Missing staging-environment secrets:$missing"
            exit 1
          fi

      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.STAGING_SSH_KEY }}

      - name: Pull + restart stack
        env:
          HOST: ${{ secrets.STAGING_SSH_HOST }}
          USER: ${{ secrets.STAGING_SSH_USER }}
          APP_DIR: ${{ secrets.STAGING_APP_DIR || '/opt/tamamhealth' }}
          SHA: ${{ needs.build-and-push.outputs.sha }}
          GH_OWNER: ${{ github.repository_owner }}
        run: |
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts
          ssh "$USER@$HOST" \
            "cd $APP_DIR && \
             export GH_OWNER='$GH_OWNER' IMAGE_TAG=staging && \
             docker compose -f docker-compose.yml -f docker-compose.ghcr.yml pull && \
             docker compose -f docker-compose.yml -f docker-compose.ghcr.yml up -d && \
             docker image prune -f && \
             echo 'Deployed sha=$SHA tag=staging'"

      - name: Verify staging health
        env:
          HEALTH_URL: ${{ vars.STAGING_HEALTH_URL }}
          SHA: ${{ needs.build-and-push.outputs.sha }}
        run: |
          if [ -z "$HEALTH_URL" ]; then
            echo "::error title=Staging health URL not configured::Set the STAGING_HEALTH_URL environment variable after TLS is working on the staging hostname."
            exit 1
          fi
          for i in $(seq 1 30); do
            STATUS="$(curl -sS -m 10 -o /tmp/health.json -w '%{http_code}' "$HEALTH_URL" || echo 000)"
            if [ "$STATUS" = "200" ]; then
              RELEASE="$(jq -r '.release // empty' /tmp/health.json)"
              if [ "$RELEASE" = "$SHA" ]; then
                echo "Healthy at expected release $RELEASE after ${i} checks:"
                cat /tmp/health.json
                echo
                exit 0
              fi
              echo "attempt ${i}: healthy response is stale release '${RELEASE:-unknown}', expected '$SHA'"
            else
              echo "attempt ${i}: $HEALTH_URL -> $STATUS"
            fi
            sleep 10
          done
          echo "::error title=Staging unhealthy::$HEALTH_URL never returned 200 after the deploy. Last body:"
          cat /tmp/health.json 2>/dev/null || true
          exit 1

      # An unread red run is not an alarm. Opens one issue while this
      # workflow is broken and closes it on the next success.
      - name: Raise or clear the failure alarm
        if: always()
        uses: ./.github/actions/alert-failure
        with:
          status: ${{ job.status }}
          severity: Staging is not up to date, so nothing is being validated before production.
