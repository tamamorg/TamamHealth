name: patient-reminders-dispatch

# Daily dispatch of due patient reminders (KAN-104).
#
# The dispatch logic and the /api/patient-reminders/dispatch route already
# existed, but nothing ever called them on a schedule — so no patient had
# received a reminder. The feature was present in code and absent in reality.
# This is the missing caller.
#
# Runs at 07:00 Africa/Juba (UTC+2) = 05:00 UTC. Deliberately morning-local:
# a recall SMS that lands at 3am is worse than useless, and GitHub cron is
# UTC-only so the offset is applied here rather than in the app.
#
# Authentication uses GitHub's short-lived OIDC token, bound by the platform to
# this repository, this workflow on main, and schedule/workflow_dispatch — the
# same scheme the transfer sweep uses. No long-lived secret is required.
#
# This replaced a shared secret that was never set: the gate below failed every
# morning for weeks, and no patient received a reminder in that time. A job whose
# only prerequisite is a secret someone has to remember is a job that does not
# run.
#
# `vars.PLATFORM_BASE_URL` overrides the host for a non-standard deployment.
#
# The platform ALSO requires PATIENT_REMINDER_SMS_ENABLED=true and a configured
# SMS_PROVIDER before anything is actually sent — without them this run reports
# gatewayEnabled:false (HTTP 202) and sends nothing, which is the intended
# behaviour for a deployment that has not wired a gateway yet.

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  # Raise/close the failure alarm — see .github/actions/alert-failure.
  issues: write

concurrency:
  # Never let two dispatch runs overlap. Dispatch is idempotent at the record
  # level (a reminder flips to 'sent' before the next read sees it), but
  # serialising runs keeps the SMS gateway's rate limits predictable.
  group: patient-reminders-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    name: dispatch due reminders
    runs-on: ubuntu-latest
    # NOT `environment: production`.
    #
    # That gate exists so a human confirms a DEPLOYMENT. This is a scheduled
    # maintenance sweep, and a cron that needs an approval click every hour is
    # not a cron: once the environment gained required reviewers, every run sat
    # waiting, the next hour's run superseded it in the concurrency group, and
    # it was cancelled. No sweep ran at all between 2026-08-18 21:34 and the
    # removal of this line.
    #
    # The concurrency group above STAYS — it is what stops two sweeps racing
    # the same records, and it was not the cause.
    timeout-minutes: 10
    steps:
      # Only the alarm action — this job does not otherwise need the repo,
      # and a local `uses:` cannot resolve without a checkout. Sparse so it
      # stays a few kilobytes rather than a full clone.
      - name: Fetch the failure-alarm action
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github/actions/alert-failure
          sparse-checkout-cone-mode: false

      - name: Dispatch
        env:
          BASE_URL: ${{ vars.PLATFORM_BASE_URL || 'https://app.tamamhealth.org' }}
        run: |
          set -euo pipefail
          OIDC_RESPONSE="$(curl -sS --fail-with-body \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=tamamhealth-reminder-dispatch")"
          OIDC_TOKEN="$(printf '%s' "$OIDC_RESPONSE" | jq -r '.value // empty')"
          if [ -z "$OIDC_TOKEN" ]; then
            echo "::error title=OIDC token missing::GitHub did not issue a reminder-dispatch identity token."
            exit 1
          fi
          echo "::add-mask::$OIDC_TOKEN"

          # --fail-with-body so a non-2xx exits non-zero AND still shows the
          # response, which is what makes a broken gateway visible here rather
          # than silently succeeding.
          RESPONSE=$(curl -sS --fail-with-body \
            --max-time 300 \
            -X POST \
            -H "authorization: Bearer $OIDC_TOKEN" \
            -H 'content-type: application/json' \
            "$BASE_URL/api/patient-reminders/dispatch")
          echo "$RESPONSE"

          # Surface the counts in the run summary so an operator can see
          # delivery health without opening the app.
          echo "### Reminder dispatch" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          echo "$RESPONSE" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          # A permanently-failed reminder means a patient was NOT reached and
          # nothing else will retry it. Fail the run so it is noticed.
          PERM=$(echo "$RESPONSE" | grep -o '"permanentlyFailed":[0-9]*' | grep -o '[0-9]*$' || echo 0)
          if [ "${PERM:-0}" -gt 0 ]; then
            echo "::error title=Reminders permanently failed::$PERM reminder(s) exhausted their retries and were not delivered. Staff must follow these up manually."
            exit 1
          fi

      # An unread red run is not an alarm. Opens one issue while this
      # workflow is broken and closes it on the next success.
      - name: Raise or clear the failure alarm
        if: always()
        uses: ./.github/actions/alert-failure
        with:
          status: ${{ job.status }}
          severity: Patients are not receiving appointment reminders — missed ANC, immunisation and follow-up visits.
