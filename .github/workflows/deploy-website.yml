name: deploy-website

# The marketing site does NOT ride the platform's pipeline.
#
# It runs on its own droplet (infra/digitalocean-website), whose systemd unit
# pulls `registry.digitalocean.com/tamamhealth/website:latest` — DigitalOcean's
# registry. Every other workflow here publishes to GHCR, so nothing CI has ever
# built reached that droplet: the public site could only be updated by hand,
# and it drifted a generation behind main. This publishes the same image CI
# builds to the registry the droplet actually reads.
#
# Manual, and gated on the `production` environment, so shipping the public
# site is a decision rather than a side effect of merging.

on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'Git SHA to build and publish. Blank = current main HEAD.'
        required: false
        type: string
      restart:
        description: 'How to make the droplet pick up the new image. "ssh" needs WEBSITE_SSH_* secrets. "reboot" uses the DO API instead (~40s downtime) and needs no extra secrets. "none" publishes only.'
        required: true
        type: choice
        default: ssh
        options:
          - ssh
          - reboot
          - none

permissions:
  contents: read

concurrency:
  group: deploy-website
  cancel-in-progress: false

jobs:
  publish:
    name: build + push website image to DOCR
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.sha || 'main' }}

      - name: Resolve metadata
        id: meta
        run: |
          SHA="$(git rev-parse HEAD)"
          {
            echo "sha=${SHA:0:7}"
            echo "image=registry.digitalocean.com/tamamhealth/website"
          } >> "$GITHUB_OUTPUT"

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      # The registry is DigitalOcean's `starter` tier: 500 MB total, which one
      # Next.js image very nearly fills. Without pruning, the second or third
      # deploy dies with `denied: quota exceeded` AFTER a full build — so free
      # the previous image before pushing the new one, not after.
      #
      # Tags are deleted first because garbage collection only reclaims
      # UNTAGGED manifests; a tagged old image is never collected. `latest` is
      # what the droplet pulls, so it is the last thing removed and the first
      # thing restored by the push below.
      #
      # This runs BEFORE the docker login on purpose: starting a garbage
      # collection invalidates the registry's existing credentials, so a login
      # taken beforehand comes back 401 on push.
      # The registry is DigitalOcean's `starter` tier: 500 MB total. Keeping a
      # few generations means old tags have to be retired, and retiring them
      # means an occasional garbage collection — which is the delicate part.
      #
      # A collection puts the registry into a phase literally named "waiting
      # for write JWTs to expire", during which the token endpoint refuses
      # `push` scope and returns a bare 401 that mentions nothing about
      # collection. Three deploys failed that way. Worse, each attempt's
      # `docker login` minted a fresh write token, so the collection kept
      # waiting and never drained — the retries were what sustained the
      # outage. Hence: drain first, log in after, and keep the token's life
      # short so the next drain is short too.
      - name: Prune the registry before pushing
        run: |
          REPO=website
          CAP=500000000                     # starter tier, bytes
          THRESHOLD=$((CAP * 60 / 100))     # collect only once genuinely full

          # Terminal states only. Everything else — including the JWT-drain
          # phase — means the registry is still refusing writes. Listing the
          # states that mean "busy" is what went wrong before: the drain phase
          # was not among them, so the wait fell through into a failing push.
          wait_for_gc() {
            for _ in $(seq 1 120); do
              BUSY=$(doctl registry garbage-collection list -o json 2>/dev/null \
                | jq '[.[]? | select((.status // "") | test("^(succeeded|failed|cancelled)$") | not)] | length' 2>/dev/null || echo 0)
              [ "${BUSY:-0}" = "0" ] && return 0
              echo "waiting: garbage collection in progress ($(doctl registry garbage-collection list -o json 2>/dev/null | jq -r '[.[]? | select((.status // "") | test("^(succeeded|failed|cancelled)$") | not)] | .[0].status // "?"'))"
              sleep 10
            done
            echo "garbage collection has not finished after 20 minutes" >&2
            return 1
          }

          wait_for_gc

          # Retire old builds, but never the two newest or `latest` — the
          # droplet pulls `latest` on every start, so deleting it leaves a
          # restart with nothing to pull if the build below then fails.
          # Read JSON: `list-tags` ignores `--format Tag`, and splitting its
          # table on whitespace fed doctl the header row and every size, date
          # and digest as though each were a tag.
          OLD=$(doctl registry repository list-tags "$REPO" -o json 2>/dev/null \
            | jq -r '[.[]? | select(.tag != "latest")] | sort_by(.updated_at) | reverse | .[2:] | .[]?.tag // empty')
          REMOVED=0
          for t in $OLD; do
            echo "retiring tag $t"
            doctl registry repository delete-tag "$REPO" "$t" --force && REMOVED=1 || true
          done

          USED=$(doctl registry get -o json 2>/dev/null | jq '.[0].storage_usage_bytes // 0')
          echo "registry holds ${USED} of ${CAP} bytes"

          # Collection is expensive and blocks pushes, so it is worth it only
          # when the space is actually needed.
          if [ "${USED:-0}" -gt "$THRESHOLD" ]; then
            echo "above ${THRESHOLD} bytes — collecting"
            doctl registry garbage-collection start --include-untagged-manifests --force >/dev/null || true
            wait_for_gc
          elif [ "$REMOVED" = 1 ]; then
            echo "tags retired; leaving their blobs for a later collection"
          else
            echo "nothing to reclaim"
          fi

      # Short-lived registry credentials from the same token Terraform used to
      # create the registry, rather than a second long-lived docker login.
      # Taken after the prune, never before: a collection cannot finish while
      # any write token is outstanding, and the expiry is the ceiling on how
      # long the next one has to wait. Ten minutes covers build + push with
      # room to spare.
      - name: Log in to DigitalOcean Container Registry
        run: doctl registry login --expiry-seconds 600

      - uses: docker/setup-buildx-action@v3

      # NEXT_PUBLIC_* is inlined into the client bundle at BUILD time, exactly
      # as the platform image warns. Every login entry point on the site
      # redirects through PLATFORM_URL, so if this is wrong the public site
      # sends staff to the wrong deployment. The code default is production;
      # the repo/environment variable overrides it when a deployment needs to
      # point somewhere else.
      - name: Build + push website image
        uses: docker/build-push-action@v6
        with:
          context: ./website
          file: ./website/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_PLATFORM_URL=${{ vars.NEXT_PUBLIC_PLATFORM_URL || 'https://app.tamamhealth.org' }}
          # Both tags point at one image, so they cost one image's storage —
          # and the SHA tag is what makes a rollback possible without a
          # rebuild. The prune above keeps the two newest and retires the rest.
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha }}

      # The droplet's website.service re-pulls on start, but a RUNNING
      # container keeps its old image — `Restart=always` only fires when the
      # process exits. So a push alone does not update a healthy droplet; the
      # unit has to be restarted. Opt-in, matching deploy-production's SSH gate.
      - name: Check whether website SSH is configured
        id: gate
        env:
          H: ${{ secrets.WEBSITE_SSH_HOST }}
          U: ${{ secrets.WEBSITE_SSH_USER }}
          K: ${{ secrets.WEBSITE_SSH_KEY }}
        run: |
          if [ "${{ github.event.inputs.restart }}" != "ssh" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
          elif [ -n "$H" ] && [ -n "$U" ] && [ -n "$K" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Website droplet not restarted::Image ${{ steps.meta.outputs.sha }} is published to DOCR, but no WEBSITE_SSH_* secrets are set, so the running container still serves the old image. Restart it with: ssh <user>@<host> 'systemctl restart website'"
          fi

      - name: Set up SSH agent
        if: steps.gate.outputs.ready == 'true'
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.WEBSITE_SSH_KEY }}

      # Fail with the fix, not with "Permission denied (publickey)". The
      # deploy key is set in this environment, but it only works once its
      # public half is in the droplet's authorized_keys — and that needs the
      # DO console, because there is no API to add a key to a running droplet.
      - name: Check the deploy key is authorised on the droplet
        if: steps.gate.outputs.ready == 'true'
        env:
          HOST: ${{ secrets.WEBSITE_SSH_HOST }}
          USER: ${{ secrets.WEBSITE_SSH_USER }}
        run: |
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          if ! ssh -o BatchMode=yes -o ConnectTimeout=15 "$USER@$HOST" 'true' 2>/dev/null; then
            echo "::error title=Deploy key not authorised::The image is published, but $USER@$HOST rejected the deploy key, so the droplet still serves the old one. Add the public half of WEBSITE_SSH_KEY to ~/.ssh/authorized_keys on the droplet (DigitalOcean → Droplets → tamamhealth-website → Console), or re-run this workflow with restart=reboot, which needs no key."
            exit 1
          fi

      - name: Restart website.service
        if: steps.gate.outputs.ready == 'true'
        env:
          HOST: ${{ secrets.WEBSITE_SSH_HOST }}
          USER: ${{ secrets.WEBSITE_SSH_USER }}
        run: |
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts
          ssh "$USER@$HOST" "systemctl restart website && sleep 5 && systemctl is-active website"

      # No SSH on this droplet today, and adding a key needs console access. The
      # DO token that already publishes the image can also reboot the box, and
      # website.service pulls on boot — so a reboot delivers the image without
      # any new secret. It costs ~40s of downtime, which is why it is an
      # explicit choice rather than the default.
      - name: Reboot the website droplet
        if: ${{ github.event.inputs.restart == 'reboot' }}
        env:
          DROPLET: tamamhealth-website
        run: |
          ID=$(doctl compute droplet list --format ID,Name --no-header \
                | awk -v n="$DROPLET" '$2==n {print $1}' | head -1)
          if [ -z "$ID" ]; then
            echo "::error title=Droplet not found::No droplet named $DROPLET in this account."
            exit 1
          fi
          echo "Rebooting $DROPLET (id=$ID)"
          doctl compute droplet-action reboot "$ID" --wait
          echo "Reboot complete; website.service pulls the image on boot."

      - name: Verify the live site
        if: ${{ steps.gate.outputs.ready == 'true' || github.event.inputs.restart == 'reboot' }}
        run: |
          for i in $(seq 1 24); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -L --max-time 15 https://tamamhealth.org/health-system || true)
            [ "$code" = "200" ] && echo "live: /health-system 200" && exit 0
            sleep 10
          done
          echo "::error title=Site did not come up::/health-system never returned 200 after the restart."
          exit 1
