name: backups-restore-drill

# Quarterly restore drill — proves the latest CouchDB + Postgres backups
# decrypt and pass structural checks. Runs the FIRST day of each quarter at
# 03:00 UTC (chosen to dodge the 02:15 UTC nightly backup window — we don't
# want the drill colliding with a fresh upload).
#
# Manual trigger is also exposed (workflow_dispatch) so the operator can run
# an out-of-band drill before any DR exercise.
#
# This workflow only runs the structural drill — it does NOT mutate any
# database. The actual backup uploads run on the host via the systemd timer
# documented in docs/operations/backups.md.
#
# Required GitHub secrets (production environment):
#   AWS_ACCESS_KEY_ID
#   AWS_SECRET_ACCESS_KEY
#   AWS_REGION                  (default af-south-1)
#   BACKUP_BUCKET
#   BACKUP_PRIVKEY_GPG          armored GPG private key (paste full block)
#   BACKUP_PRIVKEY_PASSPHRASE   passphrase for the above (recommended)
#
# Optional:
#   AWS_ENDPOINT_URL            for Backblaze B2 / MinIO
#   DRILL_SKIP_POSTGRES         set to "1" if Postgres analytics not yet wired
#
# Alerting: GitHub Actions surfaces failures via the workflow notification
# channel set on the repo. Wire that to PagerDuty/Slack/email per
# docs/operations/backups.md (operator-side wiring; this workflow only emits
# the failing exit code).

on:
  schedule:
    # 03:00 UTC every Monday (dodging the 02:15 UTC nightly backup window).
    #
    # This was quarterly. A quarterly drill is not a safety net: it is a
    # ~90-day window in which the backup pipeline can be broken with nobody
    # knowing, and the first run of this workflow did fail — silently, for
    # months, because nothing looked at it again until the next quarter.
    # Weekly bounds that window to seven days at negligible cost (the drill is
    # read-only and takes minutes).
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backups-restore-drill
  cancel-in-progress: false

jobs:
  drill:
    name: restore drill (latest snapshots)
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Checked together, before anything is installed or downloaded, so an
      # unprovisioned environment says exactly which secrets are missing in one
      # run instead of failing on the first one and hiding the rest.
      - name: Verify the drill is provisioned
        env:
          BACKUP_BUCKET: ${{ secrets.BACKUP_BUCKET }}
          BACKUP_PRIVKEY_GPG: ${{ secrets.BACKUP_PRIVKEY_GPG }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          missing=""
          for name in BACKUP_BUCKET BACKUP_PRIVKEY_GPG AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY; do
            eval "value=\${$name:-}"
            [ -n "$value" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error title=Backups are not provisioned::Missing on the production environment:$missing. Until these are set there is no offsite backup to restore from — see docs/operations/backups.md."
            exit 1
          fi
          echo "All drill secrets present."

      - name: Install drill prerequisites
        run: |
          # NOTE: do not `apt-get install awscli` — the package was dropped from
          # the Ubuntu 24.04 (noble) archive, which is what ubuntu-latest now
          # resolves to, and the drill failed on 2026-07-01 with
          # "Package 'awscli' has no installation candidate". The runner image
          # ships AWS CLI v2 already; fall back to the official installer only
          # if a future image drops it.
          sudo apt-get update -qq
          sudo apt-get install -y -qq gnupg postgresql-client
          if ! command -v aws >/dev/null 2>&1; then
            echo "AWS CLI not preinstalled on the runner — installing v2"
            curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "$RUNNER_TEMP/awscliv2.zip"
            unzip -q "$RUNNER_TEMP/awscliv2.zip" -d "$RUNNER_TEMP"
            sudo "$RUNNER_TEMP/aws/install"
          fi
          aws --version
          gpg --version | head -1
          pg_restore --version

      - name: Materialize the GPG private key
        env:
          PRIVKEY: ${{ secrets.BACKUP_PRIVKEY_GPG }}
        run: |
          if [ -z "$PRIVKEY" ]; then
            echo "::error::BACKUP_PRIVKEY_GPG secret is not set on the production environment"
            exit 1
          fi
          install -d -m 0700 "$RUNNER_TEMP/keys"
          umask 077
          printf '%s\n' "$PRIVKEY" > "$RUNNER_TEMP/keys/backup-privkey.asc"
          echo "BACKUP_PRIVKEY_PATH=$RUNNER_TEMP/keys/backup-privkey.asc" >> "$GITHUB_ENV"

      - name: Run the drill
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION || 'af-south-1' }}
          BACKUP_BUCKET: ${{ secrets.BACKUP_BUCKET }}
          BACKUP_PRIVKEY_PASSPHRASE: ${{ secrets.BACKUP_PRIVKEY_PASSPHRASE }}
          AWS_ENDPOINT_URL: ${{ secrets.AWS_ENDPOINT_URL }}
          DRILL_SKIP_POSTGRES: ${{ vars.DRILL_SKIP_POSTGRES }}
        run: |
          if [ -z "${BACKUP_BUCKET:-}" ]; then
            echo "::error::BACKUP_BUCKET secret is not set"
            exit 1
          fi
          ./scripts/backup-restore-drill.sh

      - name: Annotate failure
        if: failure()
        run: |
          echo "::error title=Backup restore drill failed::Investigate immediately. See docs/operations/backups.md for the runbook."
