<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>TamamHealth link preview card</title>
<!--
  The 1200×630 card link previews show (opengraph-image.jpg / twitter-image.jpg).

  This product-led composition uses Tamam's text-only wordmark, real clinical
  interface, blueprint registration marks and offline/sync states. The photo
  cutout supplies human context without replacing the product as the subject.

  Regenerate with scripts/make-og-card.mjs after the copy or imagery changes;
  the alt text beside each JPG has to change with it.
-->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --ink: #001d3f;
    --navy: #113055;
    --deep: #015697;
    --blue: #2191d0;
    --ice: #c9f4ff;
    --gold: #fdd95f;
    --orange: #ff7f00;
    --heading: "Barlow Condensed", system-ui, sans-serif;
    --body: "Barlow", system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; font-family: var(--body); color: var(--navy); }
  .card {
    position: relative; width: 1200px; height: 630px; overflow: hidden;
    background: linear-gradient(112deg, #fff 0%, #fff 42%, #f2fcff 42%, #f2fcff 100%);
  }
  .network {
    position: absolute; inset: 0 0 0 auto; width: 600px; opacity: 0.46;
    background-image: radial-gradient(rgba(1,86,151,0.24) 1.3px, transparent 1.3px);
    background-size: 24px 24px;
    mask-image: linear-gradient(100deg, transparent 2%, #000 52%, #000 100%);
  }
  .edge { position: absolute; right: 0; top: 0; width: 22px; height: 100%; background: var(--navy); }
  .edge::after { content: ""; position: absolute; left: 0; top: 128px; width: 22px; height: 160px; background: var(--orange); }

  .copy { position: absolute; z-index: 5; left: 62px; top: 46px; width: 485px; }
  .brand { width: max-content; margin-bottom: 78px; }
  .wordmark { display: block; width: 108px; height: auto; }
  .wordmark-sub {
    display: block; margin-top: 3px; color: var(--deep); font-size: 7.5px;
    line-height: 1; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase;
  }
  .kicker { color: var(--deep); font-size: 21px; line-height: 1; font-weight: 600; margin-bottom: 19px; }
  h1 {
    width: 480px; color: var(--navy); font-family: var(--heading); font-size: 72px;
    font-weight: 600; letter-spacing: -0.03em; line-height: 0.96;
  }
  .lede { width: 425px; margin-top: 25px; color: #3c5574; font-size: 21px; line-height: 1.43; font-weight: 500; }

  .states { display: flex; gap: 10px; margin-top: 29px; }
  .state { display: flex; align-items: center; gap: 9px; padding: 10px 13px; border: 1px solid rgba(17,48,85,0.32); background: #fff; font-size: 15px; font-weight: 700; }
  .state::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--orange); }
  .state.sync::before { background: var(--blue); box-shadow: 0 0 0 3px rgba(33,145,208,0.16); }
  .url { display: flex; align-items: center; gap: 11px; margin-top: 20px; color: var(--navy); font-size: 16px; font-weight: 700; }
  .url::before { content: ""; width: 36px; height: 5px; background: var(--orange); }

  .stage {
    position: absolute; z-index: 2; left: 560px; top: 112px; width: 720px; height: 438px;
    transform: rotate(-1.25deg); transform-origin: center;
  }
  .stage::before { content: ""; position: absolute; inset: 19px -12px -17px 18px; background: var(--orange); }
  .screen {
    position: absolute; inset: 0; overflow: hidden; background: #fff;
    border: 11px solid #fff; outline: 1px solid rgba(17,48,85,0.28);
    box-shadow: 0 22px 52px rgba(17,48,85,0.20);
  }
  .screen::after { content: ""; position: absolute; inset: 0; box-shadow: inset 0 0 0 1px rgba(17,48,85,0.10); pointer-events: none; }
  .screen img { width: 100%; height: 100%; object-fit: cover; object-position: 27% top; }
  .corner { position: absolute; z-index: 4; width: 17px; height: 17px; color: var(--navy); }
  .corner::before, .corner::after { content: ""; position: absolute; background: currentColor; }
  .corner::before { left: 8px; top: 0; width: 1px; height: 100%; }
  .corner::after { left: 0; top: 8px; width: 100%; height: 1px; }
  .tl { left: -9px; top: -9px; }
  .tr { right: -9px; top: -9px; }
  .bl { left: -9px; bottom: -9px; }
  .br { right: -9px; bottom: -9px; }

  .clinician {
    position: absolute; z-index: 4; right: -26px; bottom: -148px; width: 478px; height: auto;
    filter: drop-shadow(-14px 17px 19px rgba(17,48,85,0.18));
  }
  .record-tab {
    position: absolute; z-index: 6; right: 54px; top: 83px; padding: 10px 16px 11px;
    color: var(--ink); background: var(--gold); border: 1px solid var(--navy);
    font-family: var(--heading); font-size: 17px; font-weight: 600;
    transform: rotate(1.5deg);
  }
</style>
</head>
<body>
  <div class="card">
    <div class="network"></div><div class="edge"></div>
    <div class="copy">
      <div class="brand">
        <img class="wordmark" src="../public/assets/tamam-logo-type.svg" alt="" />
        <span class="wordmark-sub">Healthcare System</span>
      </div>
      <p class="kicker">One patient. One record.</p>
      <h1>Care should never start from zero</h1>
      <p class="lede">The patient’s history stays within reach—even when power and networks are not.</p>
      <div class="states"><span class="state">Works offline</span><span class="state sync">Syncs when connected</span></div>
      <span class="url">tamamhealth.org</span>
    </div>
    <div class="stage">
      <div class="screen"><img src="../public/assets/platform-doctor.png" alt="" /></div>
      <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
    </div>
    <span class="record-tab">The record follows the patient</span>
    <img class="clinician" src="../public/assets/social-clinician-v2.png" alt="" />
  </div>
</body>
</html>
