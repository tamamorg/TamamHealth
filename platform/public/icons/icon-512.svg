  <!-- PWA icon, 512px. Rounded tile, purpose=any.
       The mark is knocked out of the brand navy rather than drawn in it. The
       bare mark had no ground of its own, so on a light home screen it washed
       out and its smallest dots dissolved below about 32px. The navy is the
       accent-primary token (#015697), the same one the app header and the
       manifest theme_color use. -->
